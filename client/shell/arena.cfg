// Клавиши, без которых в браузере не сыграть.
//
// Quake пишет «нажми ESC и выбери команду в меню». В браузере это не работает:
// ESC там снимает захват мыши, а до меню не доходит. В Clan Arena без выбора
// команды играть нельзя вовсе — человек остаётся зрителем и не понимает почему.
//
// Буквы, а не F-клавиши: браузеры разбирают F1, F3, F5, F11 и F12 на себя,
// и попасть в игру ими нельзя.

bind k "team red"
bind l "team blue"
bind o "team spectator"
// «cmd» отправляет слово серверу как есть. Просто «ready» до сервера доходило
// как обычный чат — в логе висели десятки строк «mike: ready», а матч всё ждал.
bind p "cmd ready"

// Меню всё-таки нужно — например, сменить настройки. Даём другую клавишу.
bind m "togglemenu"
