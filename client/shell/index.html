<!DOCTYPE html><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arena-app</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0a0b}
/* Канва занимает окно ровно, без растяжения: буфер кадра задаётся под этот же
   размер ниже. Иначе движок рисует в 640x480 и картинку растягивает браузер —
   выглядит это как «всё крупное и мыльное». */
canvas{display:block;width:100vw;height:100vh}

/* Экран загрузки. Нужен не для красоты: первый заход тянет сотни мегабайт,
   и без него человек несколько минут смотрит в чёрное и решает, что сломалось. */
#loading{
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1.25rem;
  background:#0a0a0b; color:#d8d4cf;
  font:14px/1.5 ui-monospace,Menlo,monospace; letter-spacing:.08em;
}
#loading h1{
  margin:0; font-size:1.1rem; font-weight:700;
  letter-spacing:.35em; text-transform:uppercase;
}
#bar{width:min(30rem,70vw); height:3px; background:#26262a}
#bar i{display:block; height:100%; width:0; background:#c1440e; transition:width .2s}
#what{color:#6f6a64; text-transform:uppercase; font-size:12px}
#hint{color:#6f6a64; font-size:12px; max-width:30rem; text-align:center; line-height:1.7}
#need{max-width:34rem; text-align:center}
#need p{margin:0 0 1rem}
#need .note{color:#6f6a64; font-size:12px; line-height:1.7}
#source{color:#4a4640; font-size:11px}

/* Подсказка о клавишах. Нужна не для удобства: игра сама пишет «нажми ESC»,
   а в браузере это не работает, и без подсказки человек просто не начнёт. */
/* Столбиком, а не строкой: в строку пять пунктов не влезают и переносятся
   посередине, разрывая клавишу и её значение. */
#keys{
  position:fixed; left:1.25rem; bottom:1.25rem;
  display:grid; grid-template-columns:1fr auto; align-items:start;
  column-gap:1.5rem; row-gap:.6rem;
  background:#0f0f10; border:1px solid #26262a; border-left:3px solid #c1440e;
  color:#d8d4cf; font:13px/1.5 ui-monospace,Menlo,monospace;
  padding:.7rem 1rem; z-index:10;
}
#keys b{color:#6f6a64; text-transform:uppercase; letter-spacing:.12em; font-size:11px}
#keys-list{
  grid-column:1/-1;
  display:grid; grid-template-columns:auto auto; gap:.35rem .7rem; align-items:center;
}
#keys kbd{
  background:#c1440e; color:#fff; padding:.1rem 0; font:inherit; font-weight:700;
  min-width:1.6em; text-align:center;
}
/* display:flex ниже перебивает правило браузера [hidden]{display:none},
   и полоса висела бы пустой ещё до того, как её заполнили */
#keys[hidden]{display:none}
#keys-close{
  background:transparent; border:0; color:#6f6a64; cursor:pointer;
  font-size:18px; line-height:1; padding:0 .25rem;
}
#source a{color:#6f6a64}
#pick{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.pick{
  cursor:pointer; font:inherit;
  background:#c1440e; color:#fff; border:1px solid #c1440e;
  padding:.55rem 1.2rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
}
.pick:hover{background:#e2521a; border-color:#e2521a}

/* Экран после выхода из игры. Движок к этому моменту стоит на титрах id
   Software и вкладку закрыть не может — дверь обратно рисуем сами. */
#over{
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem;
  background:#0a0a0b; color:#d8d4cf;
  font:14px/1.5 ui-monospace,Menlo,monospace; letter-spacing:.08em;
}
#over p{margin:0; text-transform:uppercase; color:#6f6a64; font-size:12px}
</style>
<canvas id=canvas></canvas>
<div id=keys hidden>
  <b id=keys-title></b>
  <span id=keys-list></span>
  <button type="button" id="keys-close">×</button>
</div>
<div id=loading>
  <h1>arena</h1>
  <div id=bar><i></i></div>
  <div id=what>подготовка</div>
  <div id=hint></div>
  <div id=source class=note></div>
  <div id=need hidden>
    <p id=need-text></p>
    <button type="button" id="need-button" class="pick"></button>
    <input type="file" id="pick" webkitdirectory directory multiple>
    <p id=need-note class=note></p>
  </div>
</div>
<script type=module src="./shell.js"></script>
