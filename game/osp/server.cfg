// arena-app — стартовый shell-конфиг сервера.
// Разбор решений: arch-hq/reference/browser-clan-arena.md
//
// ВАЖНО, иначе правки молча пропадут: при старте режима OSP сбрасывает
// геймплейные cvar на свои хардкод-значения. Пережить это может только тот
// список, что приведён в конце Docs/osp-q3-ModeInfo.txt. Здесь — ТОЛЬКО он.
// Всё остальное — в cfg-modes/arena.cfg.

set sv_hostname     "arena-app"
set sv_maxclients   "12"          // 3x3 плюс места под зрителей.
                                  // Только здесь: в конфиге режима этот cvar
                                  // роняет сервер — прямой запрет в ModeInfo.txt
set g_motd          "CA promode"

// ── физика ──────────────────────────────────────────────────────────────────
set server_promode  "1"           // CPM: воздушное управление, мгновенная смена
                                  // оружия, армор без распада.
                                  // Имя cvar — Docs/osp-q3-Variables.txt.
                                  // Что именно меняется — Docs/CPM-info.txt.
                                  // Рокет-джамп CPM не трогает: отдача ракеты
                                  // усилена на 20%, но «doesn't affect
                                  // rocket-jumping» (CPM-info.txt, п.3)

// ── режим ───────────────────────────────────────────────────────────────────
// Штатный Clan Arena (mode_start 5) не подходит: он жёстко ставит match_hurtself 1,
// то есть самоурон включён. Отключить его в стартовом конфиге нельзя — cvar не
// входит в список переживающих. Поэтому свой режим через mode_customfile.
set mode_customfile "cfg-modes/modes.txt"
set mode_start      "8"           // первый пользовательский режим — 8
                                  // (ModeInfo.txt, список mode_start).
                                  // ПРОВЕРИТЬ на первом запуске: в том же файле
                                  // ниже пример, где то же значение названо 7.
                                  // Верить списку, а не примеру, но убедиться

set g_gametype      "5"           // дубль из arena.cfg, и он обязателен: g_gametype
                                  // латчится и применяется только при рестарте
                                  // карты. Конфиг режима выполняется уже ПОСЛЕ
                                  // загрузки карты, поэтому сам по себе даёт лишь
                                  // «g_gametype will be changed upon restarting»,
                                  // а рестарт никто не делает — сервер остаётся в
                                  // FFA. Проверено на запуске 10.09.2026

set server_availmodes "0"         // голосованием в штатные режимы не уйти:
                                  // иначе вернётся самоурон
set vote_allow_promode "0"        // и VQ3-физика тоже не вернётся

// ── что лежит на карте ──────────────────────────────────────────────────────
// Дубль из arena.cfg, и он обязателен. Эти два cvar читаются в момент, когда
// карта расставляет предметы, а конфиг режима выполняется ПОЗЖЕ: в логе
// InitGame идёт раньше «execing cfg-modes/arena.cfg». Без дубля на первой
// карте после запуска валяется всё — броня, аптечки, стволы и патроны, —
// и убирается только со следующей карты. Проверено 10.09.2026.
set item_disable    "1023"        // ни брони, ни аптечек, ни стволов, ни патронов
set powerup_disable "255"         // и ни одного пауэрапа

// sv_pure задаётся при запуске (game/Dockerfile), а не здесь. Причина: этот же
// конфиг выполняет браузерный клиент для локальной игры, а там pure всё ломает —
// после подключения локального клиента движок перестаёт читать с диска всё, кроме
// .cfg, и OSP теряет свой список карт. Целостность контента — свойство
// развёртывания, а не правил игры.

// ── карты ───────────────────────────────────────────────────────────────────
set map_autoload    "0"           // дубль из arena.cfg по той же причине, что и
                                  // g_gametype: список карт строится при загрузке
                                  // карты, до выполнения конфига режима. Без этого
                                  // OSP сам добавит все карты из паков
set map_file        "cfg-maps/camaps.txt"

// ── логи: отсюда сайт берёт статистику ──────────────────────────────────────
// Формат строк — Docs/osp-q3-Logging.txt: Kill:, Weapon_Stats, Game_Start,
// Game_End: Roundlimit.
set g_log           "logs/games.log"
set g_logSync       "1"
set logfile         "2"
set log_default     "0"           // расширенная строка Kill: с именами и оружием
set log_stat        "1"           // Weapon_Stats: попытки/попадания по стволам

// ── доступ ──────────────────────────────────────────────────────────────────
// Значения — в .env, не здесь. В git попадает только имя переменной.
set rconpassword    ""
set ref_password    "none"

set bot_enable      "1"           // боты включены: без них пустой сервер — это
                                  // пустая карта, а зайти вдвоём получается
                                  // не всегда
// bot_minplayers не используем вовсе, ни здесь, ни в конфиге режима. В конфиге
// режима он ломается: OSP перечитывает тот файл каждый раунд, сбрасывая счётчик
// к своему нулю, и каждое перечитывание добавляло ещё четверых — 4, 8, 12,
// после чего живым людям сервер отвечал «server is full». Здесь он бесполезен:
// сброс режима затирает наше значение. Поэтому состав набираем поимённо, ниже.

map pro-q3dm6

// Состав ботов. Поимённо и один раз, сразу после загрузки карты: заданные так,
// они переживают рестарты раундов и не размножаются. Число ботов = число строк,
// убрать их всех — закомментировать. Аргументы: имя, сложность 1..5, команда.
addbot sarge 3 red
addbot grunt 3 blue
addbot major 3 red
addbot visor 3 blue
