// arena-app — Clan Arena, CPM-физика, одна карта.
// Разбор решений: arch-hq/reference/browser-clan-arena.md

set sv_hostname     "arena-app"
set sv_maxclients   "12"          // 3x3 плюс места под зрителей
set g_motd          "CA promode"

// ── режим ───────────────────────────────────────────────────────────────────
set g_gametype      "5"           // OSP: Clan Arena
set g_promode       "1"           // CPM: воздушное управление
                                  // ^ ПРОВЕРИТЬ имя и значение по
                                  //   Docs/osp-q3-Variables.txt из поставки OSP.
                                  //   Это единственный cvar здесь, взятый
                                  //   не из документации, а из обсуждений.

// Самоурон в OSP CA выключен по умолчанию, отдача сохранена — не трогаем.
// Почему это не противоречие — см. заметку, g_combat.c:989.

set g_friendlyFire  "0"
set timelimit       "0"

// ── контент ─────────────────────────────────────────────────────────────────
set sv_pure         "1"
set sv_allowDownload "0"          // паки раздаёт content-сервер, не движок

// ── логи: отсюда сайт берёт статистику ──────────────────────────────────────
set g_log           "logs/games.log"
set g_logSync       "1"
set logfile         "2"

// ── доступ ──────────────────────────────────────────────────────────────────
// Значения — в .env, не здесь. В git попадает только имя переменной.
set rconpassword    ""

set bot_enable      "0"
map pro-q3dm6
