// arena-app — режим «arena»: Clan Arena на CPM-физике, без самоурона.
//
// Откуда взялись значения: это копия хардкод-дефолтов штатного Clan Arena
// (reference/osp-clanarena-defaults.cfg, файл из поставки OSP 1.03a) с двумя
// правками — они помечены ПРАВКА. Копия, а не наследование: OSP перед входом в
// пользовательский режим сбрасывает cvar к общим дефолтам Q3/OSP, а не к CA
// (ModeInfo.txt). Значит всё, что нужно Clan Arena, приходится назвать здесь.
//
// Цена решения: мы больше не получаем «гарантированно те же настройки, что на
// любом OSP-сервере». Обновится OSP — сверить с reference/ вручную.
//
// sv_maxclients здесь быть НЕ должно: ModeInfo.txt прямо запрещает.

set g_gametype 5                  // ПРАВКА: пользовательский режим не наследует
                                  // гейм-тип, его надо назвать явно

// ── чего хотели от режима ───────────────────────────────────────────────────
set match_hurtself 0              // ПРАВКА: в штатном CA здесь 1. Самоурона нет,
                                  // отдача остаётся — рокет-джамп бесплатный.
                                  // ПРОВЕРИТЬ в игре: что отдача действительно
                                  // не обнулилась вместе с уроном
set server_promode 1              // продублировано из server.cfg: неясно, переживает
                                  // ли safe-list сброс перед пользовательским режимом

// ── Q3-настройки штатного CA ────────────────────────────────────────────────
set dmflags 8
set fraglimit 5
set capturelimit 8
set roundlimit 5
set timelimit 0
set g_allowVote 1
// Прогрев выключен, и это из-за ботов: они не жмут «готов», а OSP ждёт
// готовности всех. С шестью ботами матч не начнётся никогда — человек
// нажимает «готов» и остаётся стоять. Вернуть, когда играть будут только люди.
set g_doWarmup 0
set g_forcerespawn 20
set g_friendlyFire 0
set g_gravity 800
set g_quadfactor 3
set g_smoothClients 0
set g_warmup 60
set g_weaponrespawn 5
set g_weaponteamrespawn 30
set pmove_fixed 0
set pmove_msec 8
set sv_allowdownload 0            // ПРАВКА: в штатном CA здесь 1. Паки раздаёт
                                  // контент-сервер, а не движок
set sv_floodprotect 0

// ── OSP-настройки штатного CA ───────────────────────────────────────────────
set armor_q2style 0
set gauntlet_damage 50
set gauntlet_disable 0
set hook_enable 0
set item_disable 1023             // на карте не лежит ничего: ни брони, ни аптечек,
                                  // ни стволов, ни патронов (маска = сумма всех
                                  // предметов, Variables.txt)
set powerup_disable 255           // и ни одного пауэрапа
set map_autoload 0                // иначе OSP сам добавит в ротацию все карты,
                                  // какие найдёт в паках — при первом запуске
                                  // подтянулась 41 стоковая. Играем только по
                                  // cfg-maps/camaps.txt
set map_once 1
set map_queue 1
set map_rotate 0
set match_carespawn 0
set match_cawarmupfire 1
set match_dropitems 0
// Пришедшего в середине раунда сажаем играть, а не в зрители: на сервере,
// где людей единицы, ждать конца чужого раунда — это ждать в пустоту
set match_latejoin 1
set match_maxsuicides 0
set match_minplayers 2
// Ноль намеренно, хотя в наших прежних правках стояла четвёрка. Этот файл OSP
// перечитывает на каждом раунде, и каждое перечитывание досыпало ещё четверых:
// 4 -> 8 -> 12, после чего живым людям сервер отвечал «server is full».
// Состав набирается поимённо в server.cfg, командами addbot.
set bot_minplayers 0
set match_mutespecs 0
set match_overtime 0
set match_overtimecount 0
set match_overtimelength 5
// Порог согласия минимальный: на сервере, где живой человек один среди ботов,
// любая доля выше единицы означает ожидание того, кто никогда не согласится
set match_readypercent 1
set match_roundtimer 10
set match_timeoutlength 60
set match_timeoutcount 1
set match_winbyscore 0
set mg_damage 7
set mg_damageTeamplay 5
set railgun_damage 100
set replace_machinegun 0
set replace_shotgun 0
set replace_glauncher 0
set replace_rlauncher 0
set replace_lightning 0
set replace_railgun 0
set replace_plasmagun 0
set replace_bfg 0
set replace_quad 0
set replace_battlesuit 0
set replace_haste 0
set replace_regen 0
set replace_flight 0
set server_thrufloors 0
set team_allcaptain 1
set team_armordamage 0
set team_maxplayers 0
set team_nocontrols 0

// ── комплект со старта ──────────────────────────────────────────────────────
// Пополнить его негде — item_disable 1023 убрал с карты всё. Раунд идёт, пока
// не кончатся патроны или команда.
set weapon_have 127               // MG, SG, GL, RL, LG, RG, PG (сумма масок).
                                  // Гаунтлет выдаётся отдельно: gauntlet_disable 0
set weapon_start 8                // в руках — ракетница
set start_health 125              // в reference/ не указан, берётся общий дефолт
set start_armor 200
set start_bullets 25
set start_shells 20
set start_grenades 15
set start_rockets 80
set start_lightning 150
set start_slugs 15
set start_cells 100
set start_bfg 0
set warmup_armor 100
set weapon_deaddrop 0

// ── голосования ─────────────────────────────────────────────────────────────
set vote_allow_allcaptain 1
set vote_allow_armordamage 1
set vote_allow_capturelimit 1
set vote_allow_ca_startrespawn 1
set vote_allow_ca_warmupfire 1
set vote_allow_dropitems 1
set vote_allow_falling 1
set vote_allow_fastrail 1
set vote_allow_fraglimit 1
set vote_allow_items 1023
set vote_allow_instagib 1
set vote_allow_lgcooldown 1
set vote_allow_map 1
set vote_allow_machinegun 1
set vote_allow_mutespecs 1
set vote_allow_notimer 1
set vote_allow_overtime 1
set vote_allow_pmove 1
set vote_allow_respawn 1
set vote_allow_roundlimit 1
set vote_allow_timenudge 1
set vote_allow_timelimit 1
set vote_limit 5
set vote_percent 50

// ── секреты ─────────────────────────────────────────────────────────────────
// Именно отсюда, а не из server.cfg: перед входом в пользовательский режим OSP
// сбрасывает ВСЕ cvar к дефолтам, включая rconpassword. Проверено — с паролем
// только в стартовом конфиге rcon отвечает «No rconpassword set on the server».
// Сам файл генерится из .env и в git не попадает: scripts/render-secrets.sh
exec secrets.cfg
